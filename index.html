<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock Control · Planta Motores Valencia</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--blue:#003478;--blue-mid:#00509E;--blue-light:#E8F0FB;--side:#0a3a96;--top:#00296b;--bg:#eef1f6;--ink:#1a1a2e;--soft:#6b7280;--line:#e5e7eb;
--ok:#16a34a;--okb:#e7f6ec;--rev:#ea580c;--revb:#fdeee3;--alert:#dc2626;--alertb:#fde8e8;--pend:#64748b;--purple:#8b5cf6;--teal:#14b8a6;--warning:#D48C00;
--shadow:0 1px 4px rgba(0,0,0,.08);--nav-w:230px;--topbar-h:56px}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
/* ===== TOPBAR ===== */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar-h);background:var(--top);display:flex;align-items:center;gap:14px;padding:0 22px 0 calc(var(--nav-w) + 22px);z-index:200;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.topbar-logo{height:30px}
.topbar-title{font-weight:700;font-size:14px;white-space:nowrap}
.topbar-subtitle{font-size:13px;opacity:.85;padding-left:12px;border-left:1px solid rgba(255,255,255,.35);white-space:nowrap}
.demo{background:#fbbf24;color:#3b2a00;font-weight:700;font-size:10px;padding:3px 8px;border-radius:99px;white-space:nowrap;letter-spacing:.04em}
.sp{flex:1}
.clock{font-size:12px;opacity:.8;white-space:nowrap}
.topbar select{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:4px 8px;font:inherit;font-size:12.5px;min-width:0}
.topbar select option{color:#1a1a2e}
/* ===== SIDEBAR ===== */
.sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--nav-w);background:var(--side);display:flex;flex-direction:column;z-index:210;overflow-y:auto;padding:var(--topbar-h) 0 10px}
.sidebar-title{margin:16px 12px 10px;padding-bottom:10px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:rgba(255,255,255,.75);border-bottom:1px solid rgba(255,255,255,.18)}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 16px;margin:3px 8px;border-radius:9px;cursor:pointer;font-size:13.5px;font-weight:500;color:rgba(255,255,255,.9);user-select:none;transition:background .15s}
.nav-item:hover{background:rgba(255,255,255,.1)}
.nav-item.active{background:#fff;color:var(--blue);font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.nav-icon{width:18px;text-align:center;font-size:14px}
.nav-item .cnt{margin-left:auto;background:var(--alert);color:#fff;border-radius:99px;font-size:11px;min-width:20px;height:20px;display:grid;place-items:center;font-weight:700;padding:0 5px}
.subnav{display:flex;flex-direction:column;margin:0 8px 6px 34px}
.subnav a{padding:6px 10px;font-size:12.5px;color:rgba(255,255,255,.7);cursor:pointer;border-radius:6px}
.subnav a:hover{color:#fff}.subnav a.on{color:#fff;font-weight:700;background:rgba(255,255,255,.12)}
.sidebar .foot{margin-top:auto;font-size:11px;color:rgba(255,255,255,.6);padding:14px 18px;line-height:1.45;border-top:1px solid rgba(255,255,255,.15)}
.sidebar .foot b{color:#fff}
/* ===== MAIN ===== */
.main-content{margin-left:var(--nav-w);margin-top:var(--topbar-h);padding:0 26px 40px;min-height:calc(100vh - var(--topbar-h))}
main{position:relative;min-width:0}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:20px 0 14px;flex-wrap:wrap}
h1{font-size:1.45rem;font-weight:600;margin:0;color:var(--ink)}
.sub{font-size:.82rem;color:var(--soft);margin:3px 0 0}
.ph-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h3{font-size:.9rem;font-weight:700;margin:0 0 12px;color:var(--ink)}
.cb,.card{background:#fff;border-radius:10px;box-shadow:var(--shadow);padding:20px 24px;margin-bottom:16px;min-width:0}
.cb.p0{padding:0;overflow:hidden}
.mb{margin-bottom:16px}
.muted{color:#9ca3af}.small{font-size:12px}
.pos{color:var(--ok)!important;font-weight:700}.neg{color:var(--alert)!important;font-weight:700}
.r{text-align:right!important;font-variant-numeric:tabular-nums;white-space:nowrap}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:16px}
.kpi{background:#fff;border-radius:10px;box-shadow:var(--shadow);border-top:3px solid var(--blue);padding:16px 18px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi .l{font-size:.66rem;font-weight:700;letter-spacing:.07em;color:var(--soft);text-transform:uppercase}
.kpi .v{font-size:1.75rem;font-weight:800;color:var(--ink);line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .h{font-size:.74rem;color:#9ca3af}
.kpi .kb{height:3px;width:45%;border-radius:2px;margin-top:10px;background:var(--blue)}
.kpi.c-green{border-top-color:var(--ok)}.kpi.c-green .kb{background:var(--ok)}
.kpi.c-orange{border-top-color:var(--rev)}.kpi.c-orange .kb{background:var(--rev)}
.kpi.c-red{border-top-color:var(--alert)}.kpi.c-red .kb{background:var(--alert)}
.kpi.c-purple{border-top-color:var(--purple)}.kpi.c-teal{border-top-color:var(--teal)}.kpi.c-sky{border-top-color:#3b82f6}.kpi.c-gray{border-top-color:#94a3b8}
.prog{height:6px;background:#e5e7eb;border-radius:9px;overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:var(--blue);border-radius:9px}
/* Filtros e inputs */
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:.66rem;font-weight:700;letter-spacing:.07em;color:var(--soft);text-transform:uppercase}
input,select,textarea{font:inherit;font-size:.84rem;border:1px solid #d1d5db;border-radius:6px;padding:6px 10px;background:#fafafa;color:var(--ink);outline:none;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);background:#fff}
.pfilters{display:flex;align-items:flex-end;gap:18px;padding:16px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dd{position:relative;min-width:160px}
.dd-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid #d1d5db;border-radius:6px;padding:6px 10px;font-size:.84rem;color:var(--ink);background:#fafafa;cursor:pointer;font-family:inherit;white-space:nowrap}
.dd-btn.open{border-color:var(--blue);background:#fff}
.dd-arrow{font-size:.7rem;color:var(--soft);transition:transform .2s}.dd-btn.open .dd-arrow{transform:rotate(180deg)}
.dd-panel{display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:999;background:#fff;border:1px solid #d1d5db;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.12);padding:6px 0;min-width:180px;max-height:260px;overflow-y:auto}
.dd-panel.open{display:block}
.dd-opt{display:flex;align-items:center;gap:10px;padding:7px 14px;font-size:.84rem;cursor:pointer;user-select:none}
.dd-opt:hover{background:#f0f4ff}.dd-opt.selected{background:#eff6ff;font-weight:600}
.dd-opt input{accent-color:var(--blue);pointer-events:none;margin:0}
/* Botones */
.btn{font:inherit;border:none;background:#eef0f3;color:#374151;border-radius:6px;padding:7px 14px;font-size:.8rem;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(.96)}
.btn.pri,.btn-iniciar-conteo{background:var(--blue);color:#fff;border:none;border-radius:6px;padding:8px 18px;font-size:.84rem;font-weight:700;cursor:pointer;font-family:inherit}
.btn.sm{padding:4px 10px;font-size:.76rem}
.btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35)}
.btn:disabled,.btn-iniciar-conteo:disabled{opacity:.4;cursor:not-allowed}
.btn-volver{background:#fff;border:1.5px solid var(--blue);color:var(--blue);border-radius:6px;padding:4px 12px;font-size:.8rem;font-weight:600;cursor:pointer;font-family:inherit}
.btn-volver:hover{background:var(--blue);color:#fff}
.btn-ver{background:none;border:0;color:var(--blue);font-weight:700;font-size:.82rem;cursor:pointer;font-family:inherit;white-space:nowrap}.btn-ver:hover{text-decoration:underline}
.conteo-bloque-accion{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:14px 22px}
/* Tablas */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.82rem}
th{padding:9px 14px;font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);text-align:left;white-space:nowrap;background:#f9fafb;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}
td{padding:9px 14px;color:var(--ink);border-bottom:1px solid #f1f3f6;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#f5f8ff}
tr.click{cursor:pointer}
tr.tot td{font-weight:700;background:#f9fafb}
.tw{overflow:auto;border:1px solid var(--line);border-radius:8px}
.ptable{max-height:470px;overflow:auto}
table.ctr th,table.ctr td{text-align:center;white-space:nowrap}
table.ctr th:first-child,table.ctr td:first-child{position:sticky;left:0;z-index:2;background:#fff;border-right:1px solid var(--line);text-align:left;min-width:190px}
table.ctr th:first-child{z-index:4;background:#f9fafb}
table.ctr tbody tr:hover td:first-child,table.ctr tr.sel td{background:#f5f8ff}
.pz{font-weight:600;white-space:nowrap}
.badge-qty{display:inline-block;background:#eef2f7;color:#334155;border-radius:12px;padding:1px 9px;font-size:.72rem;font-weight:700}
.mono2{font-family:'Courier New',monospace;font-weight:700;color:var(--blue);font-size:.8rem;white-space:nowrap}
.chip-code{font-family:'Courier New',monospace;font-size:.72rem;font-weight:700;color:#1e40af;background:#e8effc;border-radius:4px;padding:2px 7px;white-space:nowrap}
/* Pastillas de estado */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.66rem;font-weight:800;letter-spacing:.05em;padding:3px 10px;border-radius:99px;white-space:nowrap;text-transform:uppercase}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{color:#15803d;background:#dcfce7}.pill.rev{color:#c2410c;background:#ffedd5}.pill.alert{color:#b91c1c;background:#fee2e2}
.pill.pend{color:#6b7280;background:#f1f3f6;border:1px solid #e5e7eb}.pill.pend::before{display:none}
.pill.inv{color:#1d4ed8;background:#dbeafe}.pill.res{color:#475569;background:#e2e8f0}
.tag-test{font-size:.58rem;font-weight:800;color:#92400e;background:#fef3c7;border-radius:4px;padding:1px 5px;margin-left:4px;letter-spacing:.04em;vertical-align:middle}
.tag-rep{font-size:.58rem;font-weight:800;color:#475569;background:#e2e8f0;border-radius:4px;padding:1px 5px;margin-left:4px;letter-spacing:.04em;vertical-align:middle}
.ago{font-size:.66rem;color:#9ca3af;margin-top:3px}
.late{font-size:.62rem;font-weight:700;color:#9a3412;background:#ffedd5;border-radius:4px;padding:1px 5px;margin-left:4px}
/* Popover planificación */
.pop{position:fixed;z-index:250;width:310px;background:#fff;border-radius:12px;box-shadow:0 12px 36px rgba(0,0,0,.22);border:1px solid var(--line);overflow:hidden}
.pop-h{display:flex;justify-content:space-between;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line)}
.pop-h.ok{background:#ecfdf3}.pop-h.rev{background:#fff4e8}.pop-h.alert{background:#fdecec}.pop-h.pend{background:#f6f7f9}
.pop-h b{display:block;font-size:.95rem}.pop-h small{color:var(--soft);font-size:.72rem}
.x{border:0;background:none;font-size:20px;cursor:pointer;color:#6b7280;line-height:1;padding:0 2px}
.pop-b{padding:10px 14px 14px}
.pr{display:flex;justify-content:space-between;gap:10px;font-size:.8rem;padding:3px 0;color:#374151}.pr b{font-weight:700;color:var(--ink)}.pr.sm{font-size:.76rem;color:var(--soft);padding-left:6px}
.pop hr{border:0;border-top:1px solid #eef0f3;margin:7px 0}
.test-note{background:#fef9c3;border:1px solid #fde68a;color:#92400e;border-radius:6px;padding:6px 8px;font-size:.74rem;text-align:center;margin-top:10px}
.pop-act{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
/* Calendario */
.calcard{display:grid;grid-template-columns:1fr 330px;padding:0;overflow:hidden}
.cal-l{padding:14px 18px 18px;border-right:1px solid var(--line);min-width:0}
.cal-nav{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.cal-nav b{min-width:130px;text-align:center;font-weight:600}
.nb{width:30px;height:28px;border:1px solid #d1d5db;border-radius:6px;background:#fff;cursor:pointer;font-size:14px;color:#374151}
.hoy{margin-left:auto;border:1.5px solid var(--blue);color:var(--blue);background:#fff;border-radius:6px;padding:4px 14px;font-weight:700;cursor:pointer;font-family:inherit}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cw{font-size:.66rem;font-weight:700;color:var(--soft);text-align:center;padding:4px 0}
.cd{position:relative;height:82px;border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-size:.75rem;font-weight:700;cursor:pointer;background:#fff}
.cd:hover{border-color:var(--blue)}
.cd.we{background:#f5f6f8;color:#9ca3af}
.cd.has{background:#ecfdf3;border-color:#86efac}
.cd.today:not(.sel){box-shadow:inset 0 0 0 2px var(--blue)}
.cd.sel{background:var(--blue);border-color:var(--blue);color:#fff}
.cd.empty{border:0;background:none;cursor:default}
.cnum{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;border-radius:99px;font-size:.64rem;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
.cd.sel .cnum{background:#fff;color:var(--blue)}
.cplan{position:absolute;bottom:6px;left:7px;font-size:.6rem;color:#9ca3af;font-weight:500}
.cd.sel .cplan{color:#c7d2fe}
.cal-r{padding:14px 16px;max-height:600px;overflow:auto}
.cal-r h4{margin:0;font-size:.92rem;font-weight:600}
.cal-r .cs{font-size:.72rem;color:var(--soft);margin:3px 0 12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.cal-it{border:1px solid var(--line);border-left:3px solid var(--ok);border-radius:6px;padding:7px 10px;margin-bottom:6px;cursor:pointer}
.cal-it.rev{border-left-color:var(--rev)}.cal-it.alert{border-left-color:var(--alert)}.cal-it.plan{border-left-color:#cbd5e1;cursor:default}
.cal-it:hover{background:#f5f8ff}
.cal-it small{display:block;font-size:.7rem;color:var(--soft);margin-top:2px}
/* ===== CONTEO ===== */
.timer{background:var(--top);color:#fff;border-radius:99px;padding:4px 12px;font-weight:700;font-size:.8rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.cb-steps{padding:16px 40px 32px}
.conteo-steps{display:flex;align-items:center}
.conteo-steps .step{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#e9ecef;color:#9ca3af;font-weight:700;font-size:.85rem;position:relative;flex-shrink:0}
.conteo-steps .step span{position:absolute;top:40px;left:50%;transform:translateX(-50%);font-size:.66rem;white-space:nowrap;color:#9ca3af;letter-spacing:.02em}
.conteo-steps .step.active{background:var(--blue);color:#fff;box-shadow:0 0 0 4px #dbe5f5}.conteo-steps .step.active span{color:var(--blue);font-weight:700}
.conteo-steps .step.completado{background:var(--ok);color:#fff}.conteo-steps .step.completado span{color:var(--ok)}
.conteo-steps .step-line{height:2px;flex:1;background:#e5e7eb}.conteo-steps .step-line.done{background:#bbe5c8}
.cb-pieza2 h2{margin:0;font-size:1.3rem;font-weight:700}
.cb-pieza2 .pd{font-size:.95rem;color:#374151;margin-top:2px}
.mini-pieza{font-size:.82rem;color:#374151;margin:-4px 0 12px}.mini-pieza b{font-weight:700}
.search-row{display:flex;align-items:center;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.lbl{font-size:.66rem;font-weight:700;letter-spacing:.07em;color:var(--soft);text-transform:uppercase;white-space:nowrap}
.search-in{flex:1;min-width:220px}
.lista{display:flex;flex-direction:column;gap:7px;max-height:600px;overflow:auto;padding:2px 4px 2px 2px}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);background:#fafbfc;border-radius:8px;padding:9px 14px;transition:.15s}
.li:hover{border-color:var(--blue);background:#f4f7ff;box-shadow:0 0 0 1px var(--blue)}
.li-t{font-weight:700;font-size:.86rem}.li-s{font-size:.72rem;color:var(--soft);margin-top:3px}.li-s b{color:#374151}.bl{color:#2563eb}
.ic-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.ic{background:#fff;border-radius:10px;box-shadow:var(--shadow);padding:16px 18px 14px;display:flex;flex-direction:column}
.ic-l{font-size:.66rem;font-weight:700;letter-spacing:.07em;color:var(--soft);text-transform:uppercase;padding-bottom:10px;border-bottom:1px solid #eef0f3;margin-bottom:2px}
.ic-r{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f3f4f6;font-size:.8rem;color:#374151}
.ic-r b{font-size:1.15rem;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}.ic-r b.okc{color:var(--ok)}.ic-r b.warn{color:var(--warning)}
.ic-bar{height:3px;width:40%;border-radius:2px;margin-top:auto}
.ic-sp{flex:1;min-height:16px}
.ic-bar.blue{background:var(--blue)}.ic-bar.green{background:var(--ok)}.ic-bar.orange{background:var(--rev)}
.two{display:grid;grid-template-columns:1fr 1px 1fr;gap:22px}
.vsep{background:var(--line)}
.sec-h{font-weight:700;font-size:.86rem;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:10px}
.tagx{font-size:.58rem;font-weight:700;color:#6b7280;background:#f1f3f6;border-radius:4px;padding:2px 6px;margin-left:6px;letter-spacing:.06em;vertical-align:middle}
.loc{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin-bottom:6px;font-size:.78rem;color:#374151;flex-wrap:wrap}
.loc:hover{border-color:var(--blue)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.detail{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.detail span{display:block;font-size:.62rem;color:var(--soft);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.detail b{font-size:.9rem}
.col-h{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:12px}
.col-t{font-weight:800;font-size:1rem}
.col-l{font-size:.64rem;font-weight:700;letter-spacing:.07em;color:var(--soft);text-transform:uppercase;margin-top:1px}
.col-l2{font-size:.72rem;color:var(--soft)}
.bdg{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;font-size:1.35rem;font-weight:800;display:grid;place-items:center;flex:none;box-shadow:0 2px 8px rgba(22,163,74,.25)}
.bdg.blue{background:linear-gradient(135deg,#003478,#00509E);box-shadow:0 2px 8px rgba(0,52,120,.25)}
.bdg.orange{background:linear-gradient(135deg,#ea580c,#f97316);box-shadow:0 2px 8px rgba(234,88,12,.25)}
.bdg.sm{width:36px;height:36px;font-size:1.1rem}
.ci{display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:#fafbfc;border-radius:8px;padding:9px 12px;margin-bottom:8px}
.ci:hover{border-color:#9db4d9}
.ci-i{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.ci-d{font-size:.72rem;color:var(--soft)}
.ci-dif{display:flex;flex-direction:column;align-items:flex-end;min-width:56px}
.ci-dif span{font-size:.58rem;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em}
.ci-dif b{font-size:.84rem}
.stepper{display:flex;align-items:center;gap:4px}
.sb{width:24px;height:30px;border:0;border-radius:5px;background:#eef0f3;color:#374151;font-size:.6rem;cursor:pointer}
.sb:hover{background:var(--blue);color:#fff}

}));

// Plan de conteo: clase A todos los meses, B cada 2 meses y C cada 3 meses
const PLAN_C={};
function planOf(mk){if(PLAN_C[mk])return PLAN_C[mk];const[y,m]=mk.split('-').map(Number),mi=y*12+m;
  return PLAN_C[mk]=PARTS.filter(p=>{const h=hashStr(p.id)%6;return p.abc==='A'||(p.abc==='B'&&(mi+h)%2===0)||(p.abc==='C'&&(mi+h)%3===0)})}
function physTemplate(p){return[
  ...p.locs.map((l,i)=>({k:'L'+i,g:'alm',code:l.code,desc:`Almacén ${l.alm} · Tipo ${l.tipo}`,sist:l.sist})),
  ...p.pous.map((u,i)=>({k:'P'+i,g:'pou',code:u.code,desc:`${u.desc} · ${u.op}`,sist:u.sist})),
  ...SEC.map(([k,l,ic,s])=>({k,g:'sec',code:l,desc:s,icon:ic,sist:p.sec[k]||0}))]}
const tmplOf=(p,k)=>physTemplate(p).find(x=>x.k===k);
function autoFor(p,live){return ENGINES.filter(e=>p.uso[e.id]>0).map(e=>({id:e.id,uso:p.uso[e.id],proc:live.proc[e.id],term:live.term[e.id]}))}
const autoTot=rows=>sum(rows.map(e=>e.uso*(e.proc+e.term)));
function statusOf(u,e,pct){const A=Math.abs;if(A(pct)<=CFG.pct/100)return'ok';if(A(e)>CFG.red)return'alert';if(A(u)>CFG.oU&&A(e)>CFG.oE)return'rev';return'ok'}
function finalize(r){const p=PART[r.pid],g=k=>sum(r.phys.filter(x=>x.g===k).map(x=>x.cnt));
  r.alm=g('alm');r.pou=g('pou');r.secT=g('sec');r.physTotal=r.alm+r.pou+r.secT;

  r.counted=r.physTotal+r.autoTotal;r.devU=r.counted-r.system;r.pct=r.system?r.devU/r.system:0;r.devE=r.devU*p.price;r.status=statusOf(r.devU,r.devE,r.pct);return r}

// ================= Histórico simulado =================
function genData(){
  const recs=[],alerts=[];let seq=1,seqA=1;
  for(let off=-6;off<=0;off++){
    const mk=addMonths(CUR_MK,off),[y,m]=mk.split('-').map(Number),wd=weekdaysOf(mk);
    planOf(mk).forEach(p=>{
      let day;
      if(off===0){day=wd[hashStr(p.id+mk)%wd.length];if(day>=TODAY.getDate()||R()>0.85)return}
      else day=wd[ri(0,wd.length-1)];
      const d=new Date(y,m-1,day,ri(6,14),ri(0,59));
      const phys=physTemplate(p).map(x=>{const s=x.g==='sec'?x.sist:Math.max(0,Math.round(x.sist*(0.9+R()*0.2)));return{k:x.k,g:x.g,sist:s,cnt:s}});
      const tot=sum(phys.map(x=>x.sist)),r=R();let dev;
      if(r<0.74)dev=Math.round(tot*(R()*0.016-0.008));
      else if(r<0.9)dev=Math.round(tot*(0.021+R()*0.02))*(R()<0.5?-1:1);
      else dev=(p.price>=3&&p.price<=10?Math.round(ri(1300,2700)/p.price):Math.round(tot*(0.04+R()*0.04)))*(R()<0.6?-1:1);
      if(off>=-1&&p.price>=3&&p.price<=10&&hashStr(p.id)%11===0)dev=-Math.round(ri(1500,2500)/p.price); // ejemplos de alerta media
      const L0=phys.find(x=>x.k==='L0');L0.cnt=Math.max(0,L0.cnt+dev);
      const live={proc:{},term:{}};ENGINES.forEach(e=>{live.proc[e.id]=Math.max(0,BASE_LIVE.proc[e.id]+ri(-8,8));live.term[e.id]=Math.max(0,BASE_LIVE.term[e.id]+ri(-30,30))});
      const auto=autoFor(p,live);
      const id=`c-${d.getTime()}-${(hashStr(p.id+seq)%0xffffff).toString(16).padStart(6,'0')}`;seq++;
      const rec=finalize({id,pid:p.id,date:d.toISOString(),op:pick(OPERARIOS),phys,auto,system:tot+autoTot(auto),test:R()<0.15,dur:p.type==='Mecanizado'?ri(70,150):ri(50,120)});recs.push(rec);
      // Reconteo unos días después cuando el conteo dio revisión o alerta
      const d2=new Date(d.getTime()+ri(1,3)*864e5);d2.setHours(ri(6,14));
      if(((off<-1&&rec.status!=='ok'&&R()<0.75)||(off<0&&rec.status==='ok'&&R()<0.08))&&mkOf(d2)===mk&&d2<SOD&&d2.getDay()>0&&d2.getDay()<6){
        const ph2=phys.map(x=>({...x,cnt:x.g==='sec'?x.sist:Math.max(0,x.sist+Math.round(x.sist*(R()*0.01-0.005)))}));
        recs.push(finalize({id:`c-${d2.getTime()}-${(hashStr(p.id+'r'+seq)%0xffffff).toString(16).padStart(6,'0')}`,pid:p.id,date:d2.toISOString(),op:pick(OPERARIOS),phys:ph2,auto,system:rec.system,test:false,dur:p.type==='Mecanizado'?ri(70,150):ri(50,120)}))}
    });
  }
  recs.sort((a,b)=>new Date(a.date)-new Date(b.date));
  recs.forEach(r=>{if(r.status==='ok')return;
    const a=newAlertObj(r,'AL-'+String(seqA++).padStart(4,'0'));
    const later=recs.find(x=>x.pid===r.pid&&new Date(x.date)>new Date(r.date));
    if(later){const d1=new Date(new Date(r.date).getTime()+ri(2,20)*3600e3).toISOString();
      a.hist.push({d:d1,t:'En investigación',x:`Asignada a ${later.op}.`});
      a.causa=pick(['Ubicación no contada en el primer conteo.','Cajas contadas como unidades.','Consumo de línea no declarado en SAP.','Recepción pendiente de registrar.']);
      a.estado='resuelta';a.resolved=later.date;a.hist.push({d:later.date,t:'Resuelta',x:`Pieza recontada (conteo ${later.id.slice(0,15)}…).`})}
    alerts.push(a)});
  const open=alerts.filter(a=>a.estado==='pendiente');
  open.filter((a,i)=>i%3===1).forEach(a=>{a.estado='investigacion';a.causa='Revisando movimientos SAP de la última semana.';
    a.hist.push({d:new Date(new Date(a.created).getTime()+5*3600e3).toISOString(),t:'En investigación',x:'Revisando movimientos SAP de la última semana.'})});
  return{recs,alerts,seq,seqA};
}

function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===12&&Array.isArray(s.recs)&&s.recs.every(r=>PART[r.pid]))return s}catch(e){}
  const g=genData();return{v:12,recs:g.recs,alerts:g.alerts,seqA:g.seqA,live:JSON.parse(JSON.stringify(BASE_LIVE)),op:OPERARIOS[0]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load();
function resetDemo(){let ok=true;try{ok=confirm('¿Restablecer la demo? Se borrarán los conteos y cambios que hayas hecho.')}catch(e){}
  if(!ok)return;try{localStorage.removeItem(KEY)}catch(e){}location.reload()}
const byDate=(a,b)=>new Date(a.date)-new Date(b.date);
const recById=id=>S.recs.find(r=>r.id===id);
const activeRecs=()=>S.recs.filter(r=>!r.replaced);
// Índice de conteos por pieza (se reconstruye en cada render)
let IDX={};
function buildIdx(){IDX={};for(const r of S.recs){if(r.replaced)continue;(IDX[r.pid]=IDX[r.pid]||[]).push(r)}for(const k in IDX)IDX[k].sort(byDate)}
const recsOf=pid=>IDX[pid]||[];
function recOf(pid,mk){const a=recsOf(pid);for(let i=a.length-1;i>=0;i--)if(mkOf(new Date(a[i].date))===mk)return a[i];return null}
function plannedDate(p,mk){const r=recOf(p.id,mk);if(r)return new Date(r.date);const wd=weekdaysOf(mk),[y,m]=mk.split('-').map(Number);return new Date(y,m-1,wd[hashStr(p.id+mk)%wd.length])}
const sysStock=p=>sum(physTemplate(p).map(x=>x.sist))+autoTot(autoFor(p,S.live));
const newId=()=>`c-${nowDemo().getTime()}-${Math.random().toString(16).slice(2,8)}`;
const alertsVisible=()=>S.alerts.filter(a=>a.estado!=='eliminada'&&(UI.incTest||!(recById(a.recId)||{}).test));

const UI={view:'plan',plan:{mk:CUR_MK,q:'',ptype:'',com:'',estado:''},dd:false,pop:null,cal:{mk:CUR_MK,day:TODAY.getDate()},
  sel:{q:'',pend:'1'},count:{pid:null},stats:{tab:'dash',period:'3',pid:null,q:''},hist:{q:'',estado:'',from:'',to:''},
  al:{sev:'',estado:'pend',tipo:'',q:''},incTest:true,drawer:null};

// ================= Render general =================
let CH=[];
function killCharts(){CH.forEach(c=>c.destroy());CH=[]}
const pill=s=>`<span class="pill ${s}">${ST[s]}</span>`;
function navUpdate(){const n=alertsVisible().filter(a=>a.estado==='pendiente'||a.estado==='investigacion').length;
  const items=[['plan','≡','Planificación'],['count','✓','Iniciar Conteo'],['stats','⚙','Estadísticas'],['alerts','⚠','Alertas']];
  $('#side').innerHTML='<div class="sidebar-title">Navegación</div>'+items.map(([v,ic,l])=>`<a class="nav-item ${UI.view===v?'active':''}" onclick="go('${v}')"><span class="nav-icon">${ic}</span>${l}${v==='alerts'&&n?`<span class="cnt">${n}</span>`:''}</a>`+
    (v==='stats'&&UI.view==='stats'?`<div class="subnav"><a class="${UI.stats.tab==='dash'?'on':''}" onclick="UI.stats.tab='dash';render()">Dashboard de KPIs</a><a class="${UI.stats.tab==='hist'?'on':''}" onclick="UI.stats.tab='hist';render()">Histórico y exportación</a></div>`:'')).join('')+
    `<div class="foot">Réplica de la herramienta que desarrollé en mis prácticas en la Planta de Motores de Ford Almussafes. Todos los datos son ficticios.<br><b>Laura Montoliu Peris</b></div>`}
function render(){buildIdx();const a=document.activeElement,fid=a&&a.id,pos=a&&a.selectionStart;killCharts();
  $('#view').innerHTML=VIEWS[UI.view]();navUpdate();
  if(fid){const e=document.getElementById(fid);if(e){e.focus();try{e.setSelectionRange(pos,pos)}catch(_){}}}
  if(UI.view==='stats'&&UI.stats.tab==='dash')drawDash()}
function go(v,o){UI.view=v;closePop();if(v==='count'&&o&&o.pid)startCount(o.pid,o.from,true);render();window.scrollTo(0,0)}
function toast(m){const t=document.createElement('div');t.className='t';t.textContent=m;$('#toast').appendChild(t);setTimeout(()=>t.remove(),2800)}
function set(path,v){const[a,b]=path.split('.');UI[a][b]=v;render()}

// ================= Módulo 1: Planificación =================
function monthDropdown(months,mk){return`<div class="dd"><button type="button" class="dd-btn ${UI.dd?'open':''}" onclick="UI.dd=!UI.dd;render()"><span>${mkShort(mk)}</span><span class="dd-arrow">▾</span></button>
  <div class="dd-panel ${UI.dd?'open':''}">${months.map(m=>`<div class="dd-opt ${m===mk?'selected':''}" onclick="UI.dd=false;UI.cal={mk:'${m}',day:1};set('plan.mk','${m}')"><input type="checkbox" ${m===mk?'checked':''}>${mkLabel(m)}</div>`).join('')}</div></div>`}
function statusCell(r){if(!r)return'<span class="pill pend">☾ Sin contar</span>';
  return`<div>${pill(r.status)}${r.test?'<span class="tag-test">PRUEBA</span>':''}</div><div class="ago">${ago(r.date)}</div>`}
function vPlan(){const u=UI.plan,mk=u.mk;
  const rows=planOf(mk).map(p=>{const r=recOf(p.id,mk),pd=plannedDate(p,mk);return{p,r,pd,late:!r&&pd<SOD}});
  const done=rows.filter(x=>x.r).length,[y,m]=mk.split('-').map(Number);
  const dLeft=mk===CUR_MK?new Date(y,m,0).getDate()-TODAY.getDate():mk<CUR_MK?0:new Date(y,m,0).getDate();
  const q=u.q.toLowerCase().trim();
  const f=rows.filter(x=>(!q||(x.p.id+' '+x.p.desc+' '+x.p.name).toLowerCase().includes(q))&&(!u.ptype||x.p.ptype===u.ptype)&&(!u.com||x.p.com===u.com)&&
    (!u.estado||(u.estado==='pend'&&!x.r)||(x.r&&x.r.status===u.estado))).sort((a,b)=>a.pd-b.pd);
  const months=[];for(let i=0;i<=6;i++)months.push(addMonths(CUR_MK,-i));
  return`<div class="ph"><div><h1>Planificación</h1><p class="sub">Programa de producción — ${mkLabel(mk)}</p></div></div>
  <div class="kpis">
    <div class="kpi"><span class="l">Pendientes por contar</span><span class="v">${rows.length-done} / ${rows.length}</span><span class="h">${mkLabel(mk)}</span><div class="kb"></div></div>
    <div class="kpi c-green"><span class="l">Días restantes</span><span class="v">${dLeft}</span><span class="h">hasta fin de mes</span><div class="kb"></div></div>
    <div class="kpi c-orange"><span class="l">Mostrando</span><span class="v">${f.length}</span><span class="h">piezas en tabla</span><div class="kb"></div></div>
  </div>
  <div class="cb p0" style="overflow:visible">
    <div class="pfilters">
      <div class="f"><label>Buscar</label><input id="pq" placeholder="Base..." value="${esc(u.q)}" oninput="set('plan.q',this.value)" autocomplete="off" style="width:190px"></div>
      <div class="f"><label>Part type</label><select onchange="set('plan.ptype',this.value)">${opt('','Todos',u.ptype)}${PTYPES.map(v=>opt(v,v,u.ptype)).join('')}</select></div>
      <div class="f"><label>Com code</label><select onchange="set('plan.com',this.value)">${opt('','Todos',u.com)}${COMS.map(v=>opt(v,v+' · '+COM_N[v],u.com)).join('')}</select></div>
      <div class="f"><label>Mes</label>${monthDropdown(months,mk)}</div>
      <div class="f"><label>Estado</label><select onchange="set('plan.estado',this.value)">${opt('','Todos',u.estado)}${opt('pend','Sin contar',u.estado)}${opt('ok','OK',u.estado)}${opt('rev','Revisión',u.estado)}${opt('alert','Alerta',u.estado)}</select></div>
      <button class="btn" onclick="UI.plan={mk:CUR_MK,q:'',ptype:'',com:'',estado:''};UI.cal={mk:CUR_MK,day:TODAY.getDate()};render()">Limpiar</button>
      <button class="btn" onclick="toast('Planificación actualizada');render()">↺ Actualizar</button>
    </div>
    <div class="ptable"><table class="ctr"><thead><tr><th>Pieza</th><th>Descripción</th><th>Com code</th><th>Part type</th><th>${mkShort(mk)}</th><th>Fecha plan.</th><th>Estado</th><th></th></tr></thead><tbody>
    ${f.map(x=>{const p=x.p;return`<tr class="${UI.pop&&UI.pop.pid===p.id?'sel':''}"><td class="pz">${p.id}</td><td class="muted small">${p.desc}</td><td>${p.com}</td><td>${p.ptype}</td><td><span class="badge-qty">1</span></td>
      <td class="small">${fmtD(x.pd)}${x.late?'<span class="late">ATRASADA</span>':''}</td><td>${statusCell(x.r)}</td><td><button class="btn-ver" onclick="openPop(event,'${p.id}')">Ver →</button></td></tr>`}).join('')||
      '<tr><td colspan="8" class="muted" style="text-align:center;padding:30px">No hay piezas para los filtros seleccionados.</td></tr>'}
    </tbody></table></div>
  </div>
  ${calendarCard()}`}
function openPop(ev,pid){ev.stopPropagation();const b=ev.currentTarget.getBoundingClientRect();
  UI.pop={pid,top:Math.max(70,Math.min(b.top-30,innerHeight-430)),left:Math.max(12,b.left-322)};renderPop();
  document.querySelectorAll('table.ctr tr.sel').forEach(t=>t.classList.remove('sel'));ev.currentTarget.closest('tr').classList.add('sel')}
function closePop(){if(!UI.pop)return;UI.pop=null;renderPop();document.querySelectorAll('table.ctr tr.sel').forEach(t=>t.classList.remove('sel'))}
function renderPop(){const P=UI.pop;if(!P){$('#pop').innerHTML='';return}
  const p=PART[P.pid],mk=UI.plan.mk,r=recOf(p.id,mk);let hd,body;
  if(r){hd={ok:'Conteo dentro de tolerancia',rev:'Desviación a revisar',alert:'Desviación crítica'}[r.status];
    body=`<div class="pr"><span>Fecha</span><b>${fmtDT(r.date)}</b></div><div class="pr"><span>Operario</span><b>${r.op}</b></div><div class="pr"><span>Teórico (SAP)</span><b>${fmtN(r.system)}</b></div><div class="pr"><span>Real contado</span><b>${fmtN(r.counted)}</b></div><hr>
    <div class="pr sm"><span>· Almacén</span><b>${fmtN(r.alm)}</b></div><div class="pr sm"><span>· Línea</span><b>${fmtN(r.pou)}</b></div>${r.secT?`<div class="pr sm"><span>· Recuentos secundarios</span><b>${fmtN(r.secT)}</b></div>`:''}<div class="pr sm"><span>· En motores hoy</span><b>${fmtN(r.autoTotal)}</b></div><hr>
    <div class="pr"><span>Desviación</span><b class="${cls(r.devU)}">${sN(r.devU)} uds (${sP(r.pct)})</b></div><div class="pr"><span>Desviación €</span><b class="${cls(r.devE)}">${sE(r.devE)}</b></div>
    ${r.test?'<div class="test-note">⚠ Marcado como conteo de prueba</div>':''}
    <div class="pop-act"><button class="btn sm" onclick="openRec('${r.id}')">Ver detalle</button><button class="btn sm pri" onclick="go('count',{pid:'${p.id}'})">Recontar →</button></div>`}
  else{hd=`Sin contar en ${mkLabel(mk).toLowerCase()}`;const prev=recsOf(p.id).filter(x=>mkOf(new Date(x.date))<mk).pop();
    body=`<div class="pr"><span>Planificada para</span><b>${fmtD(plannedDate(p,mk))}</b></div><div class="pr"><span>Teórico actual (SAP)</span><b>${fmtN(sysStock(p))}</b></div><div class="pr"><span>Ubicaciones</span><b>${p.locs.length} almacén · ${p.pous.length} línea</b></div>
    ${prev?`<hr><div class="pr"><span>Último conteo</span><b>${fmtD(prev.date)}</b></div><div class="pr"><span>Resultado</span><b>${pill(prev.status)}</b></div><div class="pr"><span>Desviación</span><b class="${cls(prev.devU)}">${sN(prev.devU)} uds</b></div>`:''}
    <div class="pop-act"><button class="btn sm pri" onclick="go('count',{pid:'${p.id}'})">Contar →</button></div>`}
  $('#pop').innerHTML=`<div class="pop" style="top:${P.top}px;left:${P.left}px" onclick="event.stopPropagation()"><div class="pop-h ${r?r.status:'pend'}"><div><b>${p.id}</b><small>${hd}</small></div><button class="x" onclick="closePop()">×</button></div><div class="pop-b">${body}</div></div>`}
function calendarCard(){const c=UI.cal,mk=c.mk,[y,m]=mk.split('-').map(Number),first=new Date(y,m-1,1),days=new Date(y,m,0).getDate(),lead=(first.getDay()+6)%7;
  const recs=activeRecs().filter(r=>mkOf(new Date(r.date))===mk),byDay={};recs.forEach(r=>{const d=new Date(r.date).getDate();(byDay[d]=byDay[d]||[]).push(r)});
  const planned=d=>planOf(mk).filter(p=>!recOf(p.id,mk)&&plannedDate(p,mk).getDate()===d&&plannedDate(p,mk)>=SOD);
  let g=['L','M','X','J','V','S','D'].map(d=>`<div class="cw">${d}</div>`).join('');
  for(let i=0;i<lead;i++)g+='<div class="cd empty"></div>';
  for(let d=1;d<=days;d++){const dt=new Date(y,m-1,d),w=dt.getDay(),l=byDay[d]||[],pl=planned(d).length;
    g+=`<div class="cd ${w===0||w===6?'we':''} ${l.length?'has':''} ${dt.getTime()===SOD.getTime()?'today':''} ${c.day===d?'sel':''}" onclick="UI.cal.day=${d};render()">${d}${l.length?`<span class="cnum">${l.length}</span>`:''}${!l.length&&pl?`<span class="cplan">${pl} plan.</span>`:''}</div>`}
  const sd=new Date(y,m-1,Math.min(c.day,days)),list=(byDay[sd.getDate()]||[]).sort(byDate),cnt=s=>list.filter(r=>r.status===s).length;
  const lbl=sd.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}).split(' ').map(w=>w==='de'?w:cap(w)).join(' ');
  const pl=planned(sd.getDate());
  return`<div class="cb calcard"><div class="cal-l"><div class="cal-nav"><button class="nb" onclick="calNav(-1)">‹</button><b>${mkLabel(mk)}</b><button class="nb" onclick="calNav(1)">›</button>
    <button class="hoy" onclick="UI.cal={mk:CUR_MK,day:TODAY.getDate()};render()">Hoy</button></div><div class="cgrid">${g}</div></div>
  <div class="cal-r"><h4>${lbl}</h4><div class="cs">${list.length} conteo(s) · ${cnt('ok')} OK · ${cnt('rev')} REVISIÓN · ${cnt('alert')} ALERTA</div>
   ${list.map(r=>`<div class="cal-it ${r.status}" onclick="openRec('${r.id}')"><span class="mono2">${r.pid}</span>${r.test?'<span class="tag-test">PRUEBA</span>':''}<small>Real: <b>${fmtN(r.counted)}</b> · Teó: ${fmtN(r.system)} · ${r.op}</small></div>`).join('')}
   ${pl.length?`<div class="cs" style="margin-top:12px">Planificadas para este día</div>${pl.map(p=>`<div class="cal-it plan"><span class="mono2">${p.id}</span><small>${p.desc} · <a class="bl" style="cursor:pointer" onclick="go('count',{pid:'${p.id}'})">Contar →</a></small></div>`).join('')}`:''}
   ${!list.length&&!pl.length?'<p class="muted small">No hay conteos registrados este día.</p>':''}</div></div>`}
function calNav(n){UI.cal.mk=addMonths(UI.cal.mk,n);UI.cal.day=1;render()}

// ================= Módulo 2: Conteo cíclico =================
const STEP_H=[['Conteo cíclico','Selecciona una pieza para empezar el conteo'],['Información de la pieza','Revisa los datos antes de empezar el conteo'],
  ['Conteo Físico','Introduce las piezas contadas en cada ubicación'],['Cálculo Automático','Piezas en la línea de montaje y motores terminados'],
  ['Resultado final','Comparativa entre el stock teórico (SAP) y el real contado'],['Registrar','Registrar conteo']];
function startCount(pid,from,silent){UI.count={pid,step:1,cnt:{},auto:null,saved:null,from:from||null,t0:null,tEnd:null,test:true};if(!silent){UI.view='count';closePop();render();window.scrollTo(0,0)}}
function gotoStep(n){const c=UI.count;if(n>=2&&!c.t0)c.t0=Date.now();if(n>=3&&!c.auto)c.auto={ts:new Date().toISOString(),rows:autoFor(PART[c.pid],S.live)};c.step=n;render();window.scrollTo(0,0)}
function backStep(){const c=UI.count;if(c.step===1){UI.count={pid:null};render()}else gotoStep(c.step-1)}
const elapsed=()=>{const c=UI.count;return c.t0?Math.floor(((c.tEnd||Date.now())-c.t0)/1000):0};
function calc(){const c=UI.count,p=PART[c.pid];
  const phys=physTemplate(p).map(x=>({k:x.k,g:x.g,sist:x.sist,cnt:c.cnt[x.k]===undefined||c.cnt[x.k]===''?(x.g==='sec'?0:0):Math.max(0,Number(c.cnt[x.k]))}));
  const auto=c.auto?c.auto.rows:autoFor(p,S.live);return finalize({pid:p.id,phys,auto,system:sum(phys.map(x=>x.sist))+autoTot(auto)})}
function stepsBar(c){const names=['Información','Conteo físico','Cálculo automático','Resultado final','Registrar'];
  return`<div class="cb cb-steps"><div class="conteo-steps">${names.map((n,i)=>{const k=i+1,dn=c.saved||k<c.step,st=dn?'completado':k===c.step?'active':'';
    const click=k<c.step&&!c.saved?`onclick="gotoStep(${k})" style="cursor:pointer" title="Volver a este paso"`:'';
    return(i?`<div class="step-line ${dn||k===c.step?'done':''}"></div>`:'')+`<div class="step ${st}" ${click}>${k===5?'✓':k}<span>${n}</span></div>`}).join('')}</div></div>`}
function vCount(){const c=UI.count,st=c.pid?c.step:0,[t,s]=STEP_H[st];
  const right=c.pid?`<div class="ph-r">${c.step>=2?`<span class="timer">⏱ <span id="timer">${fmtT(elapsed())}</span></span>`:''}${c.saved?'':'<button class="btn-volver" onclick="backStep()">← Volver</button>'}</div>`:'';
  const head=`<div class="ph"><div><h1>${t}</h1><p class="sub">${s}${c.pid?` · Operario: <b>${S.op}</b>`:''}</p></div>${right}</div>`;
  if(!c.pid)return head+vSelect();
  const p=PART[c.pid];
  const pieza=c.step===1?`<div class="cb cb-pieza2"><h2>${p.id}</h2><div class="pd">${p.desc}</div><div class="muted small" style="margin-top:4px">${p.name} · ${p.type} · Part type ${p.ptype} · Com code ${p.com}${c.from?' · <span class="pill rev">Reconteo por alerta</span>':''}</div></div>`
    :`<div class="mini-pieza"><b>${p.id}</b> · ${p.desc} <span class="muted">· ${p.name}</span>${c.from?' · <span class="pill rev">Reconteo por alerta</span>':''}</div>`;
  return head+stepsBar(c)+pieza+[step1,step2,step3,step4,step5][c.step-1](p,c)}
function vSelect(){const u=UI.sel,q=u.q.toLowerCase().trim();
  const all=(u.pend==='1'?planOf(CUR_MK).filter(p=>!recOf(p.id,CUR_MK)):PARTS).filter(p=>!q||(p.id+' '+p.desc+' '+p.name).toLowerCase().includes(q)),list=all.slice(0,150);
  return`<div class="cb"><div class="search-row"><span class="lbl">Buscar pieza</span><input id="sq" class="search-in" value="${esc(u.q)}" placeholder="Base (ej: 12345)..." oninput="set('sel.q',this.value)" autocomplete="off">
  <select onchange="set('sel.pend',this.value)">${opt('1','Pendientes del plan de este mes',u.pend)}${opt('0','Todas las piezas ('+PARTS.length+')',u.pend)}</select></div>
  <div class="lista">${list.map(p=>{const r=recOf(p.id,CUR_MK);return`<div class="li"><div><div class="li-t">${p.id} <span class="muted" style="font-weight:400;font-size:.76rem">· ${p.desc}</span></div>
    <div class="li-s"><b>Part Type:</b> <span class="bl">${p.ptype}</span> &nbsp;<b>Com Code:</b> <span class="bl">${p.com}</span> &nbsp;· ${p.name} · ${p.type} · ${r?`Contada ${ago(r.date)} ${pill(r.status)}`:'Sin contar este mes'}</div></div>
    <button class="btn-ver" onclick="startCount('${p.id}')">Seleccionar →</button></div>`}).join('')||
    '<p class="muted" style="text-align:center;padding:30px 0">No hay piezas con este filtro. Prueba con «Todas las piezas».</p>'}</div>${all.length>150?`<p class="muted small" style="margin:10px 0 0">Mostrando 150 de ${all.length} piezas · usa el buscador para encontrar el resto.</p>`:`<p class="muted small" style="margin:10px 0 0">${all.length} piezas</p>`}</div>`}
function step1(p){const last=recsOf(p.id).pop(),sys=sysStock(p),nd=new Date(SOD.getTime()+p.next.days*864e5);
  const kc=(lab,rows,bar)=>`<div class="ic"><div class="ic-l">${lab}</div>${rows.map(([k,v,c])=>`<div class="ic-r"><span>${k}</span><b class="${c||''}">${v}</b></div>`).join('')}<div class="ic-sp"></div><div class="ic-bar ${bar}"></div></div>`;
  return`<div class="ic-row">
    ${kc('Stock actual',[['Uds. en planta',fmtN(sys)],['Rechazos pendientes',p.rech,p.rech?'warn':'okc']],'blue')}
    ${kc('Última recepción',[['Fecha',fmtDash(p.last)],['Hora',p.last.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})],['Uds. recibidas',fmtN(p.lastQty)]],'green')}
    ${kc('Entrega más próxima',[['Packing slip',p.next.ps],['Fecha esperada',fmtDash(nd)],['Hora',p.next.hora],['Uds. esperadas',fmtN(p.next.qty)]],'orange')}</div>
  <div class="cb two"><div><div class="sec-h">Ubicaciones en Almacén <span class="tagx">SAP</span></div>
    ${p.locs.map(l=>`<div class="loc"><span class="mono2">${l.code}</span><span>Tipo <b>${l.tipo}</b> · <span class="badge-qty">${fmtN(l.sist)} uds</span></span><span class="muted small" style="margin-left:auto">Almacén ${l.alm}</span></div>`).join('')}</div>
    <div class="vsep"></div>
    <div><div class="sec-h">Operaciones en Línea <span class="tagx">SMART</span></div>
    ${p.pous.map(u=>`<div class="loc"><span class="mono2">${u.code}</span><span>${u.desc} · <b>${u.op}</b></span><span class="badge-qty" style="margin-left:auto">${fmtN(u.sist)} uds</span></div>`).join('')}
    <div class="loc"><span class="mono2">AGV</span><span>Suministro a línea · ${p.pack} uds/caja</span><span class="badge-qty" style="margin-left:auto">${fmtN(p.sec.AGV||0)} uds</span></div></div></div>

function vDash(){const rs=statRecs(),n=rs.length,st=periodStart();

  let wd=0;for(let d=new Date(Math.max(st,new Date(2025,0,1)));d<=SOD;d=new Date(d.getTime()+864e5)){const w=d.getDay();if(w>0&&w<6)wd++}

  const fams=PTYPES.map(f=>{const a=rs.filter(r=>PART[r.pid].ptype===f);return{f,n:a.length,v:a.length?a.filter(r=>r.status==='ok').length/a.length:null}}).filter(x=>x.n);
  if(!UI.stats.pid||!PART[UI.stats.pid])UI.stats.pid=(Object.entries(byP).sort((a,b)=>b[1].length-a[1].length)[0]||[PARTS[0].id])[0];
  const pidN=activeRecs().filter(r=>r.pid===UI.stats.pid&&new Date(r.date)>=st&&(UI.incTest||!r.test)).length;
  return`<div class="kpis">

   ${K('c-sky','Precisión media',fmtP(ap),'1 − |desviación| / teórico')}
   ${K(net<0?'c-red':'c-green','Desviación neta',`<span class="${cls(net)}">${sE(net)}</span>`,'suma con signo')}
   ${K('c-orange','Desviación absoluta',fmtE(abs),'valor total descuadrado')}
   ${K('c-red','Conteos con alerta',n?fmtP(al/n):'—',`${al} de ${n} (revisión o alerta)`)}
  </div>

    <div class="dr-sec">Datos del conteo origen</div><div class="dr-grid"><div><small>Teórico</small><b>${fmtN(r.system)}</b></div><div><small>Real</small><b>${fmtN(r.counted)}</b></div>
     <div><small>Desv. uds</small><b class="${cls(r.devU)}">${sN(r.devU)}</b></div><div><small>Desv. €</small><b class="${cls(r.devE)}">${sE(r.devE)}</b></div>
     <div><small>Operario</small><b style="font-size:.85rem">${r.op}</b></div><div><small>Fecha del conteo</small><b style="font-size:.85rem">${fmtDT(r.date)}</b></div></div>
    <button class="btn-link" onclick="openRec('${r.id}')">Ver conteo completo →</button>
    <div class="dr-sec">Causa raíz</div><textarea id="d-causa" ${done?'disabled':''} placeholder="Describe la causa raíz identificada..." oninput="UI.drawer.causa=this.value">${esc(causa)}</textarea>
    <div class="dr-sec">Comentario</div><textarea id="d-com" ${done?'disabled':''} placeholder="Notas adicionales, acciones tomadas..." oninput="UI.drawer.coment=this.value">${esc(com)}</textarea>
    <div class="dr-sec">Historial</div><div class="hist-box">${a.hist.slice().reverse().map(x=>`<div class="hi"><small>${new Date(x.d).toLocaleString('es-ES')}</small><b>${x.t}</b><span>${esc(x.x)}</span></div>`).join('')}</div></div>
    <div class="dr-f">${done?'<button class="dbtn" onclick="closeDrawer()">Cerrar</button>':`<button class="dbtn" onclick="saveAlertNotes()">💾 Guardar cambios</button>${a.estado==='pendiente'?`<button class="dbtn" onclick="setInv()">🔍 En investigación</button>`:''}
     <button class="dbtn pri" onclick="recontar()">⟳ Recontar pieza</button><button class="dbtn pri" onclick="UI.drawer.mode='edit';renderDrawer()">✎ Corregir conteo</button><button class="dbtn del" onclick="delAlert()">🗑 Eliminar</button>`}</div>`}
  $('#drawer').innerHTML=h;$('#drawer').classList.remove('hidden');$('#dback').classList.remove('hidden');
  const nb=document.querySelector('.dr-b');if(nb)nb.scrollTop=sc;
  if(fid&&fid.startsWith('e-')){const e=document.getElementById(fid);if(e){e.focus();try{e.setSelectionRange(pos,pos)}catch(_){}}}}
const curAlert=()=>S.alerts.find(x=>x.id===UI.drawer.id);
function saveAlertNotes(){const a=curAlert(),D=UI.drawer;if(D.causa!==null)a.causa=D.causa;if(D.coment!==null)a.comentario=D.coment;
  a.hist.push({d:nowDemo().toISOString(),t:'Actualizada',x:'Causa raíz y comentario guardados.'});save();toast('Cambios guardados');render();renderDrawer()}
function setInv(){const a=curAlert();a.estado='investigacion';a.hist.push({d:nowDemo().toISOString(),t:'En investigación',x:`Asignada a ${S.op}.`});save();toast('Alerta en investigación');render();renderDrawer()}
function recontar(){const a=curAlert();closeDrawer();go('count',{pid:a.pid,from:a.id})}
function delAlert(){let ok=true;try{ok=confirm('¿Eliminar esta alerta? Dejará de aparecer en el centro de alertas.')}catch(e){}if(!ok)return;
  const a=curAlert();a.estado='eliminada';a.hist.push({d:nowDemo().toISOString(),t:'Eliminada',x:`Eliminada por ${S.op}.`});save();closeDrawer();toast('Alerta eliminada');render()}
function applyCorrection(){const D=UI.drawer,a=curAlert(),old=recById(a.recId),v=editedRec(old),now=nowDemo().toISOString();
  const nr=finalize({id:newId(),pid:old.pid,date:now,op:S.op,phys:v.phys,auto:v.auto,system:old.system,test:old.test,dur:old.dur,correctedFrom:old.id,note:D.motivo.trim()});
  old.replaced=nr.id;S.recs.push(nr);a.hist.push({d:now,t:'Conteo corregido',x:`Nuevo conteo ${nr.id}. Motivo: ${nr.note}`});
  if(nr.status==='ok'){a.estado='resuelta';a.resolved=now;a.hist.push({d:now,t:'Resuelta',x:'La desviación corregida está dentro de tolerancia.'})}
  else{a.recId=nr.id;a.sev=nr.status==='alert'?'critica':'media';a.tipo=nr.status==='alert'?'Desviación crítica':'Revisión estadística'}
  save();toast(nr.status==='ok'?'Corrección guardada · alerta resuelta':'Corrección guardada · la desviación sigue fuera de tolerancia');D.mode='view';D.ed={};render();renderDrawer()}

// ================= Detalle de un conteo =================
function openRec(id){closePop();const r=recById(id),p=PART[r.pid],t=physTemplate(p),al=S.alerts.find(a=>a.recId===id&&a.estado!=='eliminada');
  const grp=(g,tit)=>{const xs=r.phys.filter(x=>x.g===g&&(g!=='sec'||x.cnt||x.sist));if(!xs.length)return'';return`<tr><td colspan="4" style="background:#f9fafb;font-weight:700;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:#6b7280">${tit}</td></tr>`+
    xs.map(x=>{const tm=t.find(z=>z.k===x.k);return`<tr><td><span class="mono2">${tm.code}</span> <span class="muted small">${tm.desc}</span></td><td class="r">${fmtN(x.sist)}</td><td class="r">${fmtN(x.cnt)}</td><td class="r ${cls(x.cnt-x.sist)}">${sN(x.cnt-x.sist)}</td></tr>`}).join('')};
  $('#mcard').innerHTML=`<div class="mhead"><div><span class="chip-code" style="font-size:.95rem">${p.id}</span> ${pill(r.status)}${r.test?'<span class="tag-test">PRUEBA</span>':''}${r.replaced?'<span class="tag-rep">REEMPLAZADO</span>':''}${r.correctedFrom?'<span class="tag-rep">CORREGIDO</span>':''}
    <div style="margin-top:6px"><b>${p.desc}</b> <span class="muted">· ${p.name} · ${p.type}</span></div></div><button class="x" style="margin-left:auto" onclick="closeModal()">×</button></div>
  <div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">
   <div class="kpi c-gray"><span class="l">Fecha</span><span class="v" style="font-size:1rem">${fmtDT(r.date)}</span><span class="h">${r.op}</span></div>
   <div class="kpi"><span class="l">Teórico (SAP)</span><span class="v">${fmtN(r.system)}</span></div><div class="kpi c-green"><span class="l">Real contado</span><span class="v">${fmtN(r.counted)}</span></div>
   <div class="kpi c-orange"><span class="l">Desviación</span><span class="v ${cls(r.devU)}">${sN(r.devU)}</span><span class="h">${sP(r.pct)} · ${sE(r.devE)}</span></div>
   <div class="kpi c-purple"><span class="l">Tiempo</span><span class="v">${fmtT(r.dur||0)}</span><span class="h">mm:ss</span></div></div>
  <div class="g2"><div class="tw"><table><thead><tr><th>Ubicación</th><th class="r">Sistema</th><th class="r">Contado</th><th class="r">Dif.</th></tr></thead><tbody>
   ${grp('alm','Almacén — Ubicaciones SAP')}${grp('pou','Lineside — Puestos SMART')}${grp('sec','Recuentos secundarios')}</tbody></table></div>
   <div class="tw"><table><thead><tr><th>Motor</th><th class="r">Uds/m</th><th class="r">En proceso</th><th class="r">Terminados</th><th class="r">Piezas</th></tr></thead><tbody>
   ${r.auto.map(e=>`<tr><td><span class="mono2">${e.id}</span></td><td class="r">${e.uso}</td><td class="r">${e.proc}</td><td class="r">${e.term}</td><td class="r">${fmtN(e.uso*(e.proc+e.term))}</td></tr>`).join('')}
   <tr class="tot"><td>Total motores</td><td></td><td class="r">${fmtN(r.mProc)}</td><td class="r">${fmtN(r.mTerm)}</td><td class="r">${fmtN(r.autoTotal)}</td></tr></tbody></table></div></div>
  ${r.correctedFrom?`<div class="note"><b>Conteo corregido.</b> Sustituye al conteo ${r.correctedFrom}. Motivo: «${esc(r.note||'')}»</div>`:''}
  ${r.replaced?`<div class="note" style="background:#f1f5f9"><b>Conteo reemplazado</b> por una corrección (${r.replaced}). No se tiene en cuenta en las estadísticas.</div>`:''}
  <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px">${al?`<button class="btn" onclick="closeModal();openAlert('${al.id}')">Ver alerta (${EST[al.estado].toLowerCase()})</button>`:''}<button class="btn pri" onclick="closeModal();go('count',{pid:'${p.id}'})">Recontar pieza →</button></div>`;
  $('#modal').classList.remove('hidden')}
function closeModal(){$('#modal').classList.add('hidden')}

// ================= Inicio =================
const VIEWS={plan:vPlan,count:vCount,stats:vStats,alerts:vAlerts};
$('#opSel').innerHTML=OPERARIOS.map(o=>opt(o,'👷 '+o,S.op)).join('');
function tick(){$('#clock').textContent=nowDemo().toLocaleString('es-ES',{weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
tick();setInterval(tick,30000);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closePop();if(UI.drawer)closeDrawer()}});
document.addEventListener('click',e=>{if(UI.dd&&!e.target.closest('.dd')){UI.dd=false;render()}if(UI.pop&&!e.target.closest('.pop')&&!e.target.closest('.btn-ver'))closePop()});
document.addEventListener('scroll',e=>{if(UI.pop&&!(e.target.closest&&e.target.closest('.pop')))closePop()},true);
render();
</script>
</body>
</html>
